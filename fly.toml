app = "fly-uptime-kuma-tar6sa"
primary_region = "ams"

[build]
  image = "louislam/uptime-kuma:2"

[[mounts]]
  source = "kuma_data"
  destination = "/app/data"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

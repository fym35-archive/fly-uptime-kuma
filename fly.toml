# fly.toml app configuration file generated for fly-uptime-kuma-cwhmrg on 2026-06-08T09:41:53Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fly-uptime-kuma-cwhmrg'
primary_region = 'ams'

[build]
  image = 'louislam/uptime-kuma:2'

[[mounts]]
  source = 'kuma_data'
  destination = '/app/data'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
